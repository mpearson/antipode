<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Antipode — see through the ground</title>
<style>
  :root {
    --ink: #e8ecf2;
    --dim: #7a8699;
    --mantle: #ff7a3d;
    --core: #ffd166;
    --bg: #05070d;
    --line: rgba(122,134,153,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #scene { position: fixed; inset: 0; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .corner {
    position: absolute; font-size: 11px; letter-spacing: 0.08em;
    color: var(--dim); text-transform: uppercase;
  }
  .tl { top: 16px; left: 16px; }
  .tr { top: 16px; right: 16px; text-align: right; }
  .bl { bottom: 16px; left: 16px; }
  .br { bottom: 16px; right: 16px; text-align: right; }
  .val { color: var(--ink); font-size: 13px; letter-spacing: 0; }
  .accent { color: var(--mantle); }

  .reticle {
    position: fixed; top: 50%; left: 50%;
    width: 54px; height: 54px; margin: -27px 0 0 -27px;
    border: 1px solid rgba(255,255,255,0.75); border-radius: 50%;
    z-index: 9; pointer-events: none;
  }
  .reticle::before, .reticle::after { content: ""; position: absolute; background: rgba(255,255,255,0.75); }
  .reticle::before { left: 50%; top: -10px; bottom: -10px; width: 1px; margin-left: -0.5px; }
  .reticle::after { top: 50%; left: -10px; right: -10px; height: 1px; margin-top: -0.5px; }

  #reticleLabel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, 34px);
    z-index: 9; pointer-events: none; text-align: center;
    font-size: 13px; letter-spacing: 0.05em; color: var(--core);
    text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,1);
    min-height: 16px; max-width: 70vw;
  }

  .gate {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(120% 80% at 50% 30%, #0b1020 0%, #05070d 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center;
  }
  .gate h1 { font-size: 13px; font-weight: 400; letter-spacing: 0.35em; text-transform: uppercase; color: var(--mantle); margin-bottom: 28px; }
  .gate p { font-size: 14px; line-height: 1.7; color: var(--dim); max-width: 30ch; margin-bottom: 8px; }
  .gate .lede { color: var(--ink); font-size: 18px; line-height: 1.5; max-width: 22ch; margin-bottom: 24px; }
  .btn {
    pointer-events: auto; margin-top: 28px;
    background: none; border: 1px solid var(--mantle); color: var(--mantle);
    font-family: inherit; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 16px 32px; border-radius: 2px; cursor: pointer; transition: background 0.2s, color 0.2s;
  }
  .btn:active { background: var(--mantle); color: var(--bg); }
  .hide { display: none !important; }
  .err { color: var(--mantle); font-size: 12px; margin-top: 20px; min-height: 16px; max-width: 32ch; }
  .spin { color: var(--dim); font-size: 12px; margin-top: 20px; letter-spacing: 0.2em; }

  #log {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    max-height: 38vh; overflow-y: auto; pointer-events: auto;
    background: rgba(3,5,10,0.92); border-top: 1px solid var(--line);
    font-size: 11px; line-height: 1.5; padding: 8px 10px 10px;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
  }
  #log .e { color: var(--mantle); }
  #log .w { color: var(--core); }
  #logbar {
    position: fixed; right: 10px; bottom: 10px; z-index: 101; pointer-events: auto;
    background: rgba(3,5,10,0.9); border: 1px solid var(--line); color: var(--dim);
    font-family: inherit; font-size: 11px; padding: 6px 10px; border-radius: 2px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="reticle hide" id="reticle"></div>

<div class="hud hide" id="hud">
  <div class="corner tl"><div>your position</div><div class="val" id="here">—</div></div>
  <div class="corner tr"><div>looking at</div><div class="val accent" id="target">—</div></div>
  <div class="corner bl"><div>heading · pitch</div><div class="val" id="orient">—</div></div>
  <div class="corner br"><div>depth</div><div class="val" id="depth">surface</div></div>
  <div id="reticleLabel"></div>
</div>

<div class="gate" id="gate">
  <h1>Antipode</h1>
  <p class="lede">Point your phone at the ground. See what's on the other side of the planet.</p>
  <p>This prototype reads your location and your phone's motion sensors, then casts your gaze straight through the Earth.</p>
  <button class="btn" id="start">Begin</button>
  <div class="err" id="err"></div>
  <div class="spin hide" id="spin">acquiring signal…</div>
</div>

<button id="logbar">console &#9662;</button>
<div id="log" class="hide"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------------- on-screen console ---------------- */
(function () {
  const box = document.getElementById('log');
  const bar = document.getElementById('logbar');
  let open = false;
  bar.addEventListener('click', () => {
    open = !open;
    box.classList.toggle('hide', !open);
    bar.innerHTML = open ? 'console &#9652;' : 'console &#9662;';
  });
  function write(cls, args) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = args.map(a =>
      typeof a === 'object' ? (a && a.message ? a.message : JSON.stringify(a)) : String(a)
    ).join(' ');
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    if (cls === 'e' && !open) bar.click();
  }
  const orig = { log: console.log, warn: console.warn, error: console.error };
  console.log   = function () { orig.log.apply(console, arguments);   write('',  [].slice.call(arguments)); };
  console.warn  = function () { orig.warn.apply(console, arguments);  write('w', [].slice.call(arguments)); };
  console.error = function () { orig.error.apply(console, arguments); write('e', [].slice.call(arguments)); };
  window.addEventListener('error', e =>
    write('e', ['Uncaught:', e.message, 'at', (e.filename||'') + ':' + (e.lineno||'?')]));
  window.addEventListener('unhandledrejection', e =>
    write('e', ['Promise rejected:', (e.reason && e.reason.message) || e.reason]));
  console.log('console ready');
})();

/* ============================================================================
 * ANTIPODE — "see through the ground" earth viewer
 * ----------------------------------------------------------------------------
 * Concept: the camera sits on Earth's surface and looks DOWN THROUGH the planet
 * to see the far side, with a live day/night terminator. Think Google Sky Map,
 * but pointed at the ground.
 *
 * ARCHITECTURE & THE NON-OBVIOUS DECISIONS (these took many iterations — change
 * with care):
 *
 * 1. SEE-THROUGH VIA BACK-FACE CULLING (not transparency).
 *    Everything is OPAQUE and rendered side: THREE.BackSide. The eye is exactly
 *    at radius R (on the surface), so the near hemisphere's faces point at the
 *    eye (front faces) and are culled — we see straight through to the inner far
 *    wall. Because it's opaque with normal depth testing, overlapping triangles
 *    from imperfect polygon triangulation just paint the same surface twice and
 *    the overdraw is INVISIBLE. (Earlier transparent versions double-blended
 *    overlaps and showed ugly dark artifacts.) This is why we don't need a
 *    perfect triangulation.
 *
 * 2. DEPTH ORDERING. Country fills are at exactly R (the surface), so the eye
 *    (also at R) stands ON the ground. The dark shell is ALSO at exactly R — a
 *    point on a sphere sees the rest of the sphere at or below its tangent plane,
 *    so a shell at R never pokes above the horizon (y=R). The shell and fills are
 *    thus co-radial and their vertices coincide along every country boundary.
 *    Rather than break that tie with polygonOffset (slope-scaled, so it flickers
 *    with view angle and left gaps just inside each border), the shell is drawn
 *    FIRST as a pure background: renderOrder=-1 + depthWrite:false, so fills
 *    always paint over it with no z-fight. Boundary/grid/horizon lines all use
 *    depthTest:false + renderOrder so they always overlay on top. Do NOT shrink
 *    the fills/lines groups to sort them — an earlier version scaled them to
 *    0.992*R, which dropped the ground ~51 km below the eye and looked like
 *    viewing from altitude.
 *
 * 3. SPHERICAL TRIANGULATION VIA GNOMONIC PROJECTION (sphericalPolygonGeometry).
 *    Country polygons are projected gnomonically onto a tangent plane at each
 *    polygon's own centroid (where great circles become straight lines), ear-
 *    clipped with THREE.ShapeUtils.triangulateShape, then mapped back to the
 *    sphere. Converting to 3D vectors BEFORE projecting makes the antimeridian
 *    (±180°) a non-issue (no lon discontinuity). bandedSphericalGeometry is the
 *    fallback for polygons too big for one gnomonic chart (e.g. Antarctica).
 *
 * 4. DAY/NIGHT IN A CUSTOM SHADER (not a directional light). Back-face rendering
 *    would invert normal-based lighting, so instead the fill shader computes a
 *    day factor = dot(surface point, live sun direction). subsolarPoint() gives
 *    the real sun position from the device clock; the loop rotates that sun
 *    vector by the same globe quaternion as the geometry so lighting stays locked
 *    to geography. (Longitude uses a simple -15°/hr model; no equation-of-time,
 *    so the terminator can be off by up to ~±4° E/W. Declination is accurate.)
 *    NOTE: the shader reimplements FogExp2 manually (uFogDensity must match
 *    scene.fog density if you retune it — two separate knobs).
 *
 * 5. CAMERA at exactly (0, R, 0). The globe is rotated each frame so the user's
 *    lat/lon lands at world +Y, i.e. under the camera. dragPitch=0 looks at the
 *    horizon; negative pitches down through the planet. The horizon ring lives in
 *    the y=R plane (eye level) — if you move the eye height, move the horizon too.
 *
 * 6. SENSORS: needs a top-level HTTPS page (not a sandboxed iframe) for device
 *    orientation. A 2.5s watchdog falls back to drag-to-look if no events arrive.
 *    The on-screen console (bottom-right) is the phone-friendly debugger.
 *
 * Data: world-atlas TopoJSON (countries-110m) from CDN. Names bundled in
 * ISO_NAMES so labels don't depend on a second fetch.
 * ==========================================================================*/

/* ---------------- guard: did Three.js load? ---------------- */
if (typeof THREE === 'undefined') {
  console.error('THREE failed to load - the CDN script was blocked. The 3D view cannot run here.');
}

const $ = id => document.getElementById(id);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

let userLat = 0, userLon = 0, haveLoc = false;   // observer position; haveLoc=false => using preset coords
let renderer, scene, camera, globe, boundaries, fills; // globe = group holding shell+fills+lines, rotated each frame
let raycaster, hoverName = '';                   // raycaster labels the country under the center reticle
let sunMesh, sunGlow, moonMesh, sunLabel, moonLabel; // sky bodies + captions, positioned each frame
const R = 1;                                     // Earth radius in scene units; eye sits at exactly this
const SKY_DIST = 50;                             // how far out the sun/moon sit (within camera far plane)

// shared uniform object so every country fill reads the same live sun direction
const sunUniforms = { uSunDir: { value: new THREE.Vector3(1, 0, 0) } };

/* ---- shared day/night surface shader: country fills AND the ocean shell ----
 * Lighting can't come from a real light here — we render BACK faces, which would
 * invert a normal-based model — so each fragment's "day" factor is just
 * dot(surface direction, live sun direction), independent of which face we view.
 * Fog (exp2 toward the background) is reimplemented in-shader because a
 * ShaderMaterial doesn't inherit three's fog automatically. The ONLY thing that
 * differs between land and sea is uColor (and the ocean's depthWrite:false). */
const surfaceVert = `
  varying float vSun;
  varying float vFogDepth;
  uniform vec3 uSunDir;
  void main() {
    vec3 worldDir = normalize((modelMatrix * vec4(position, 1.0)).xyz);
    vSun = dot(worldDir, uSunDir);
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vFogDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const surfaceFrag = `
  varying float vSun;
  varying float vFogDepth;
  uniform vec3 uColor;
  uniform vec3 uFogColor;
  uniform float uFogDensity;
  uniform float uNightFloor;
  void main() {
    // smooth terminator: full day above vSun=0.1, full night below -0.1
    float day = smoothstep(-0.1, 0.1, vSun);
    vec3 lit = uColor * mix(uNightFloor, 1.0, day);
    float f = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
    vec3 col = mix(lit, uFogColor, clamp(f, 0.0, 1.0));
    gl_FragColor = vec4(col, 1.0);
  }`;
function makeSurfaceMaterial(color, opts) {
  opts = opts || {};
  return new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: opts.depthWrite !== false,
    uniforms: {
      uSunDir:     sunUniforms.uSunDir,
      uColor:      { value: (color && color.isColor) ? color : new THREE.Color(color) },
      uFogColor:   { value: new THREE.Color(0x05070d) },
      uFogDensity: { value: 0.42 },
      uNightFloor: { value: opts.nightFloor != null ? opts.nightFloor : 0.18 }
    },
    vertexShader: surfaceVert,
    fragmentShader: surfaceFrag
  });
}

let oAlpha = 0, oBeta = 0, oGamma = 0;
let screenAngle = 0;
let gotOrientation = false;
let dragMode = false;
// dragPitch starts at 0 = looking straight at the horizon. Negative pitch aims
// down THROUGH the planet toward the far side (the core/antipode); positive
// aims up at the sky. Starting at the horizon avoids the "looking down from
// height" feel that a steep initial pitch produced.
let dragYaw = 0, dragPitch = 0;

$('start').addEventListener('click', () => { begin().catch(showFatal); });

function showFatal(e) {
  console.error('startup failed:', e);
  $('spin').classList.add('hide');
  $('err').textContent = 'Could not start: ' + (e && e.message ? e.message : e);
}

// Startup: acquire location (with fallback), request motion permission, build
// the scene, then start the render loop. Called from the Begin button so the
// iOS motion-permission prompt happens inside a user gesture.
async function begin() {
  $('err').textContent = '';
  $('spin').classList.remove('hide');
  console.log('begin: requesting location...');

  if (typeof THREE === 'undefined')
    throw new Error('3D library unavailable (CDN blocked)');

  try {
    const pos = await new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('no geolocation API'));
      navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 8000 });
    });
    userLat = pos.coords.latitude; userLon = pos.coords.longitude; haveLoc = true;
    console.log('location ok:', userLat.toFixed(3), userLon.toFixed(3));
  } catch (e) {
    userLat = 22.0599209; userLon = -159.3178611; haveLoc = false;
    console.warn('location unavailable (' + (e.message||e) + ') - using preset coordinates');
    $('err').textContent = 'Location unavailable - using preset coordinates.';
  }

  // Diagnostics: figure out WHY sensors might not be available.
  console.log('secureContext:', window.isSecureContext);
  console.log('in iframe:', window.self !== window.top);
  console.log('DeviceOrientationEvent present:', typeof DeviceOrientationEvent !== 'undefined');

  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      console.log('requesting iOS motion permission...');
      const r = await DeviceOrientationEvent.requestPermission();
      console.log('motion permission:', r);
      if (r !== 'granted') throw new Error('motion permission ' + r);
    } else {
      console.log('no requestPermission() - Android/desktop path, listeners attached directly');
    }
    // Listen for BOTH event types. Android Chrome often only fires the
    // 'absolute' variant; iOS fires the plain one.
    window.addEventListener('deviceorientation', onOrient, true);
    window.addEventListener('deviceorientationabsolute', onOrient, true);

    // Raw probe: log the very first event of EITHER type, whatever its values,
    // so we can tell "no events at all" (iframe blocked) from "events with null
    // values" (sensor present but unreferenced).
    const probe = (tag) => (e) => {
      console.log('raw ' + tag + ': a=' + e.alpha + ' b=' + e.beta + ' g=' + e.gamma +
                  ' abs=' + e.absolute);
      window.removeEventListener('deviceorientation', probeA, true);
      window.removeEventListener('deviceorientationabsolute', probeB, true);
    };
    const probeA = probe('deviceorientation');
    const probeB = probe('deviceorientationabsolute');
    window.addEventListener('deviceorientation', probeA, true);
    window.addEventListener('deviceorientationabsolute', probeB, true);
  } catch (e) {
    console.warn('motion blocked (' + (e.message||e) + ') - drag to look');
    enableDragFallback();
  }

  setTimeout(() => {
    if (!gotOrientation && !dragMode) {
      console.warn('no sensor data after 2.5s - switching to drag mode');
      console.warn('likely cause: this iframe was not granted gyroscope/accelerometer ' +
                   'permission by the host page. Open the file directly in your browser ' +
                   '(not embedded) over https to use real sensors.');
      enableDragFallback();
    }
  }, 2500);

  if (screen.orientation) {
    screenAngle = (screen.orientation.angle || 0) * D2R;
    screen.orientation.addEventListener('change', () =>
      screenAngle = (screen.orientation.angle || 0) * D2R);
  }

  initScene();
  console.log('scene initialised');
  $('gate').classList.add('hide');
  $('hud').classList.remove('hide');
  $('reticle').classList.remove('hide');
  $('here').textContent = fmt(userLat, userLon);
  loop();
  console.log('render loop running');
}

// Device orientation handler: store raw alpha/beta/gamma (radians). The first
// event flips gotOrientation so the sensor watchdog knows data is flowing.
function onOrient(e) {
  if (e.alpha == null && e.beta == null && e.gamma == null) return;
  if (!gotOrientation) { gotOrientation = true; console.log('first orientation event received'); }
  oAlpha = (e.alpha||0) * D2R; oBeta = (e.beta||0) * D2R; oGamma = (e.gamma||0) * D2R;
}

function antipode(lat, lon) { return { lat: -lat, lon: lon > 0 ? lon - 180 : lon + 180 }; }
function fmt(lat, lon) {
  const ns = lat >= 0 ? 'N' : 'S', ew = lon >= 0 ? 'E' : 'W';
  return Math.abs(lat).toFixed(2) + '\u00b0' + ns + ' ' + Math.abs(lon).toFixed(2) + '\u00b0' + ew;
}
function llToVec(lat, lon, r) {
  r = r || 1;
  const phi = (90 - lat) * D2R, theta = (lon + 180) * D2R;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}
// inverse of llToVec: a (geometry-space) direction back to lat/lon in degrees.
function vecToLL(v) {
  const u = v.clone().normalize();
  const lat = Math.asin(Math.max(-1, Math.min(1, u.y))) * R2D;
  let lon = Math.atan2(u.z, -u.x) * R2D - 180;   // atan2 gives (lon+180)
  lon = ((lon + 180) % 360 + 360) % 360 - 180;   // wrap to [-180,180]
  return { lat, lon };
}

// A small white text label that rides in 3D space and always faces the camera.
// center.y > 1 hangs the text just BELOW its anchor point on screen, so we can
// pin it to a sky body and have the caption sit under the dot (Sky-Map style).
function makeLabelSprite(text) {
  const W = 256, H = 64, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.font = '700 44px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.95)'; ctx.shadowBlur = 6;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText(text, W / 2, H / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false, fog: false
  }));
  sp.center.set(0.5, 1.35);                 // hang below the anchor (the body)
  const h = 2.4; sp.scale.set(h * (W / H), h, 1); // ~constant size at SKY_DIST
  sp.renderOrder = 9;
  return sp;
}

// Subsolar point: the lat/lon where the sun is directly overhead at a given
// time. Uses a standard low-precision solar-position approximation (good to
// well under a degree — plenty for a day/night terminator).
function subsolarPoint(date) {
  const rad = Math.PI / 180;
  // days since J2000.0
  const jd = date.getTime() / 86400000 + 2440587.5;
  const n = jd - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360;            // mean longitude
  const g = ((357.528 + 0.9856003 * n) % 360) * rad;    // mean anomaly
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad; // ecliptic long
  const epsilon = 23.439 * rad;                          // obliquity
  // solar declination
  const decl = Math.asin(Math.sin(epsilon) * Math.sin(lambda)) / rad;
  // Greenwich hour angle -> subsolar longitude. The sun is overhead at local
  // solar noon; at UTC noon it's near 0° longitude, moving -15°/hour.
  const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
  let lon = -15 * (utcHours - 12);
  while (lon > 180) lon -= 360;
  while (lon < -180) lon += 360;
  return { lat: decl, lon: lon };
}

// update the shared sun-direction uniform from the current clock
function updateSunDirection() {
  const sp = subsolarPoint(new Date());
  sunUniforms.uSunDir.value.copy(llToVec(sp.lat, sp.lon, 1).normalize());
  return sp;
}

// Sub-lunar point (where the Moon is overhead) + geocentric distance in Earth
// radii. Compact lunar theory (Schlyter) with the main periodic perturbations —
// good to roughly a few tenths of a degree, plenty to place the disk and get its
// apparent size right. Returns { lat, lon (deg), dist (Earth radii) }.
function moonPosition(date) {
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const jd = date.getTime() / 86400000 + 2440587.5;
  const d  = jd - 2451543.5;                  // Schlyter's day number
  const rev = x => ((x % 360) + 360) % 360;   // wrap to [0,360)

  // Moon orbital elements
  const N = rev(125.1228 - 0.0529538083 * d) * rad; // ascending node
  const i = 5.1454 * rad;                            // inclination
  const w = rev(318.0634 + 0.1643573223 * d);        // arg. of perigee (deg)
  const a = 60.2666;                                 // mean distance (Earth radii)
  const e = 0.054900;                                // eccentricity
  const M = rev(115.3654 + 13.0649929509 * d);       // mean anomaly (deg)

  // Sun elements needed for the perturbation arguments
  const ws = 282.9404 + 4.70935e-5 * d;
  const Ms = rev(356.0470 + 0.9856002585 * d);

  // eccentric anomaly (iterate Kepler a couple of times)
  let E = M + e * deg * Math.sin(M * rad) * (1 + e * Math.cos(M * rad));
  for (let k = 0; k < 3; k++)
    E = E - (E - e * deg * Math.sin(E * rad) - M) / (1 - e * Math.cos(E * rad));
  const Er = E * rad;

  // position in the orbital plane -> distance and true anomaly
  const xv = a * (Math.cos(Er) - e);
  const yv = a * Math.sqrt(1 - e * e) * Math.sin(Er);
  let r = Math.sqrt(xv * xv + yv * yv);
  const v = Math.atan2(yv, xv);               // rad
  const vw = v + w * rad;

  // geocentric ecliptic rectangular -> ecliptic lon/lat
  const xe = r * (Math.cos(N) * Math.cos(vw) - Math.sin(N) * Math.sin(vw) * Math.cos(i));
  const ye = r * (Math.sin(N) * Math.cos(vw) + Math.cos(N) * Math.sin(vw) * Math.cos(i));
  const ze = r * (Math.sin(vw) * Math.sin(i));
  let lonecl = Math.atan2(ye, xe) * deg;
  let latecl = Math.atan2(ze, Math.sqrt(xe * xe + ye * ye)) * deg;

  // main periodic perturbations (degrees / Earth radii)
  const Lm = rev(N * deg + w + M);            // Moon mean longitude
  const Ls = rev(ws + Ms);                    // Sun  mean longitude
  const Dm = rev(Lm - Ls);                    // mean elongation
  const F  = rev(Lm - N * deg);               // argument of latitude
  const s = x => Math.sin(x * rad), c = x => Math.cos(x * rad);
  lonecl += -1.274 * s(M - 2*Dm) + 0.658 * s(2*Dm) - 0.186 * s(Ms)
            - 0.059 * s(2*M - 2*Dm) - 0.057 * s(M - 2*Dm + Ms)
            + 0.053 * s(M + 2*Dm) + 0.046 * s(2*Dm - Ms) + 0.041 * s(M - Ms)
            - 0.035 * s(Dm) - 0.031 * s(M + Ms) - 0.015 * s(2*F - 2*Dm)
            + 0.011 * s(M - 4*Dm);
  latecl += -0.173 * s(F - 2*Dm) - 0.055 * s(M - F - 2*Dm)
            - 0.046 * s(M + F - 2*Dm) + 0.033 * s(F + 2*Dm) + 0.017 * s(2*M + F);
  r += -0.58 * c(M - 2*Dm) - 0.46 * c(2*Dm);

  // ecliptic -> equatorial (RA/Dec)
  const ecl = (23.4393 - 3.563e-7 * d) * rad;
  const lo = lonecl * rad, la = latecl * rad;
  const xg = Math.cos(lo) * Math.cos(la);
  const yg = Math.sin(lo) * Math.cos(la);
  const zg = Math.sin(la);
  const xq = xg;
  const yq = yg * Math.cos(ecl) - zg * Math.sin(ecl);
  const zq = yg * Math.sin(ecl) + zg * Math.cos(ecl);
  const RA  = Math.atan2(yq, xq) * deg;
  const Dec = Math.atan2(zq, Math.sqrt(xq * xq + yq * yq)) * deg;

  // sub-lunar longitude = RA - Greenwich mean sidereal time
  const n2 = jd - 2451545.0;
  const GMST = rev(280.46061837 + 360.98564736629 * n2);
  let subLon = RA - GMST;
  subLon = ((subLon + 180) % 360 + 360) % 360 - 180;
  return { lat: Dec, lon: subLon, dist: r };
}

function initScene() {
  renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070d, 0.42);
  // lights so the country fills get real shading across the curved surface
  scene.add(new THREE.AmbientLight(0x404a5c, 1.0));
  const keyLight = new THREE.DirectionalLight(0xfff0e0, 1.1);
  keyLight.position.set(1.5, 2, 1);
  scene.add(keyLight);
  const rimLight = new THREE.DirectionalLight(0xff8a4d, 0.5);
  rimLight.position.set(-1, -1.5, -1);
  scene.add(rimLight);
  // near was 0.01: a 10000:1 far/near ratio left almost no depth precision out
  // at the far wall (~2 units away), which aggravated the fill/shell fight. 0.05
  // gives ~5x better precision there and only clips a ~2.9°-radius cap of ground
  // right at your feet (the near-side rim), which is at the extreme periphery
  // when looking down and not noticeable. Lower it again if that rim matters.
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 100);

  globe = new THREE.Group();
  scene.add(globe);

  // OPAQUE see-through model: the eye sits exactly at the surface (radius R)
  // looking inward, so nothing is ever between the eye and the far inner wall.
  // We render only BACK faces (cull front), which means near-side geometry —
  // whose faces point up at the eye — is culled, and we see straight through to
  // the far hemisphere. Drawing opaque with normal depth testing means
  // overlapping triangles just paint the same surface twice (no double-blend),
  // so triangulation overdraw becomes invisible. Fog blends color by depth
  // through the planet, giving the "x-ray falloff" without transparency.
  // Dark ocean/earth shell at EXACTLY R — same radius as the fills and the eye,
  // so it never pokes above the horizon plane (y=R). The shell and the fills are
  // therefore CO-RADIAL, and at a country's boundary their vertices coincide. An
  // earlier version tried to win that tie with polygonOffset, but polygonOffset
  // is slope-scaled: along the thin, grazing-angle boundary triangles its push
  // swings with view angle and intermittently loses, leaving the shell to show
  // through as angle-dependent gaps just inside each border (worst looking
  // straight down). Fix: don't make it a depth *tiebreak* at all. The shell is
  // the backmost surface and never needs to occlude anything, so we draw it
  // FIRST (renderOrder -1) as a pure color background with depthWrite:false.
  // Every fill fragment then paints over it deterministically — no z-fight — and
  // the shell still stays physically at R so it never breaches the horizon.
  // Back-face only + opaque, as above.
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(R, 64, 48),
    // ocean now uses the same day/night shader as the country fills. 0x123450 is
    // the lit (day-side) ocean color; the shader dims it to 18% on the night
    // side. depthWrite:false keeps it a pure background (see depth note above).
    makeSurfaceMaterial(0x123450, { depthWrite: false })
  );
  shell.renderOrder = -1; // strictly behind every country fill
  globe.add(shell);
  // faint atmospheric halo (stays subtle; transparent is fine here since it's
  // a single non-overlapping shell)
  globe.add(new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.06, 48, 32),
    new THREE.MeshBasicMaterial({
      color: 0x2a3f63, transparent: true, opacity: 0.08,
      side: THREE.BackSide, depthWrite: false, fog: true
    })
  ));

  boundaries = new THREE.Group();
  fills = new THREE.Group();
  // Fills and lines live at exactly radius R — the true surface — so the eye
  // (also at R) stands ON the ground rather than above it. Depth ordering is
  // handled by pushing the SHELL slightly outward (see below) and by drawing
  // lines with depthTest:false, NOT by shrinking these groups. (Shrinking them
  // previously put the ground ~51 km below the eye, which looked like altitude.)
  globe.add(fills);
  globe.add(boundaries);
  buildGraticule(boundaries);
  loadCountries(boundaries, fills);

  raycaster = new THREE.Raycaster();
  const sp0 = updateSunDirection();
  console.log('subsolar point:', sp0.lat.toFixed(1) + '°, ' + sp0.lon.toFixed(1) + '°');

  // Horizon = eye-level line: the directions perpendicular to "up". The user's
  // up is world +Y and the eye is at (0,R,0), so this is a big ring in the
  // y = R plane centered on the eye. At large radius it projects to a straight
  // horizontal line through the pitch=0 vanishing point, banking correctly with
  // device roll. Kept in world space so it's independent of the spinning globe.
  const HR = 50; // large radius -> reads as a straight line at infinity
  const horizonPts = [];
  for (let i = 0; i <= 160; i++) {
    const t = (i / 160) * Math.PI * 2;
    horizonPts.push(new THREE.Vector3(Math.cos(t) * HR, R, Math.sin(t) * HR));
  }
  const horizon = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(horizonPts),
    new THREE.LineBasicMaterial({
      color: 0xff7a3d, transparent: true, opacity: 0.6, fog: false,
      depthTest: false, depthWrite: false
    })
  );
  horizon.renderOrder = 12; // above fills, grid, and country borders
  scene.add(horizon);

  const a = antipode(userLat, userLon);
  const mk = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffd166 })
  );
  mk.position.copy(llToVec(a.lat, a.lon, R * 0.99));
  globe.add(mk);

  // ---- Sun & Moon as sky bodies (Sky-Map style) --------------------------
  // Positioned each frame along their true geocentric directions (the Sun's is
  // the very vector that lights the surface), out at SKY_DIST, and sized to their
  // real angular diameter (~0.5°). depthTest:false so they read as faraway sky
  // and stay visible even when they're on the FAR side of the planet — fitting
  // the see-through-the-ground concept (a Sky-Map view shows the whole sphere,
  // not just above the horizon). Drawn after the fills, so they overlay them; the
  // white grid/border/horizon lines still draw on top.
  const sunAngR = (0.533 * D2R) / 2;          // sun angular radius (~0.27°)
  const sunR = SKY_DIST * Math.tan(sunAngR);
  sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(sunR, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0xfff3da, fog: false, depthTest: false, depthWrite: false })
  );
  sunMesh.renderOrder = 8;
  scene.add(sunMesh);
  sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(sunR * 3.4, 24, 16),
    new THREE.MeshBasicMaterial({
      color: 0xffc138, transparent: true, opacity: 0.22,
      blending: THREE.AdditiveBlending, fog: false, depthTest: false, depthWrite: false
    })
  );
  sunGlow.renderOrder = 7;
  scene.add(sunGlow);

  // Moon: a real sphere lit by the same sun direction, so it naturally shows the
  // correct phase (crescent/gibbous) from any viewing angle. Built at radius 1
  // and scaled each frame to its live angular size (its distance, and thus
  // apparent size, varies by ~10% over a month).
  const moonMat = new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false,
    uniforms: { uSunDir: sunUniforms.uSunDir, uColor: { value: new THREE.Color(0xd8dce6) } },
    vertexShader: `
      varying vec3 vN;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);   // world-space normal
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vN;
      uniform vec3 uSunDir;
      uniform vec3 uColor;
      void main() {
        float day = smoothstep(-0.04, 0.04, dot(normalize(vN), uSunDir));
        gl_FragColor = vec4(uColor * mix(0.05, 1.0, day), 1.0); // 0.05 = earthshine
      }`
  });
  moonMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), moonMat);
  moonMesh.renderOrder = 8;
  scene.add(moonMesh);

  // captions under each body
  sunLabel  = makeLabelSprite('SUN');   scene.add(sunLabel);
  moonLabel = makeLabelSprite('MOON');  scene.add(moonLabel);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// Lat/lon reference grid (every 30°). Additive, depthTest:false so it floats on
// top as an overlay (see header note 2 on line rendering).
function buildGraticule(parent) {
  const mat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.16,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, fog: false
  });
  const lines = [];
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = [];
    for (let lon = -180; lon <= 180; lon += 4) pts.push(llToVec(lat, lon, R));
    lines.push(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
  }
  for (let lon = -180; lon < 180; lon += 30) {
    const pts = [];
    for (let lat = -90; lat <= 90; lat += 4) pts.push(llToVec(lat, lon, R));
    lines.push(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
  }
  for (const ln of lines) { ln.renderOrder = 10; parent.add(ln); }
  console.log('graticule built');
}

async function loadCountries(lineParent, fillParent) {
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, fog: false
  });
  try {
    const topoRes = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    if (!topoRes.ok) throw new Error('HTTP ' + topoRes.status);
    const topo = await topoRes.json();
    drawTopo(topo, lineParent, fillParent, lineMat);
    console.log('country boundaries + fills loaded');
  } catch (e) {
    console.warn('country data unavailable (' + (e.message||e) + ') - grid only');
  }
}

// decode a TopoJSON ring to an array of [lon,lat]
function decodeRing(ring, decoded) {
  const out = [];
  for (let ai of ring) {
    const rev = ai < 0; if (rev) ai = ~ai;
    const seg = decoded[ai];
    const ordered = rev ? seg.slice().reverse() : seg;
    for (const p of ordered) out.push(p);
  }
  return out;
}

// Decode the TopoJSON country layer into per-country filled meshes (one shaded
// ShaderMaterial each, colored by a hash of the name) plus boundary lines.
// Holes (ring[1..] within a polygon) are passed through to the triangulator.
function drawTopo(topo, lineParent, fillParent, lineMat) {
  const arcs = topo.arcs, transform = topo.transform;
  const sx = transform.scale[0], sy = transform.scale[1];
  const tx = transform.translate[0], ty = transform.translate[1];
  const decoded = arcs.map(arc => {
    let x = 0, y = 0;
    return arc.map(d => { x += d[0]; y += d[1]; return [x * sx + tx, y * sy + ty]; });
  });

  // Fills use the shared day/night surface shader (see makeSurfaceMaterial near
  // the top): day/night comes from each point's direction vs the live sun, not
  // from a light, so back-face rendering doesn't invert it. Opaque and
  // depth-tested, so overlapping triangles from imperfect triangulation paint
  // identically and the overdraw stays invisible. Each country gets its own hue.
  const makeFillMaterial = (hue) =>
    makeSurfaceMaterial(new THREE.Color().setHSL(hue, 0.55, 0.5));

  for (const geom of topo.objects.countries.geometries) {
    const idKey = geom.id != null ? String(geom.id).padStart(3, '0') : null;
    const name = (idKey && ISO_NAMES[idKey]) || ('region ' + (geom.id != null ? geom.id : '?'));
    const polys = geom.type === 'Polygon' ? [geom.arcs] : geom.arcs;

    for (const poly of polys) {
      // TopoJSON/GeoJSON: within one polygon, ring[0] is the exterior, ring[1..]
      // are interior holes. We triangulate via a gnomonic projection centered on
      // the polygon, which makes great-circle arcs straight — so ear-clipping
      // there yields geodesic triangles that hug the sphere, with no pole or
      // antimeridian distortion. No special-casing needed.
      const outer = decodeRing(poly[0], decoded);
      if (outer.length < 3) continue;
      const holes = [];
      for (let h = 1; h < poly.length; h++) {
        const hr = decodeRing(poly[h], decoded);
        if (hr.length >= 3) holes.push(hr);
      }

      const linePts = outer.map(p => llToVec(p[1], p[0], R));
      if (linePts.length > 1) {
        const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), lineMat);
        ln.renderOrder = 11; // above fills and graticule
        lineParent.add(ln);
      }
      for (const hole of holes) {
        const hp = hole.map(p => llToVec(p[1], p[0], R));
        if (hp.length > 1) {
          const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(hp), lineMat);
          ln.renderOrder = 11;
          lineParent.add(ln);
        }
      }

      const geo = sphericalPolygonGeometry(outer, holes);
      if (geo) {
        const hue = (hashStr(name) % 360) / 360;
        const m = new THREE.Mesh(geo, makeFillMaterial(hue));
        m.userData.name = name;
        fillParent.add(m);
      }
    }
  }
}

// simple deterministic hash so each country gets a stable distinct hue
function hashStr(s) { let h = 0; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) & 0xffff; return h; }

// Does a [lon,lat] ring cross the ±180° antimeridian? Detected by any
// consecutive longitude jump greater than 180°.
// Clip a [lon,lat] ring to the longitude slab [lonMin, lonMax] via
// Sutherland–Hodgman (two half-plane clips on the lon axis).
function clipRingToLonBand(ring, lonMin, lonMax) {
  const clipEdge = (pts, keep) => {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const cur = pts[i], prev = pts[(i + pts.length - 1) % pts.length];
      const curIn = keep(cur[0]), prevIn = keep(prev[0]);
      if (curIn) {
        if (!prevIn) out.push(lerpLon(prev, cur, keep));
        out.push(cur);
      } else if (prevIn) {
        out.push(lerpLon(prev, cur, keep));
      }
    }
    return out;
  };
  // intersect a segment with the lon boundary, interpolating lat
  const lerpLon = (a, b, keep) => {
    const bound = keep(lonMin) && !keep(lonMax) ? lonMin
                : (!keep(lonMin) && keep(lonMax) ? lonMax
                : (Math.abs(a[0]-lonMin)<Math.abs(a[0]-lonMax)?lonMin:lonMax));
    const t = (bound - a[0]) / ((b[0] - a[0]) || 1e-9);
    return [bound, a[1] + t * (b[1] - a[1])];
  };
  let r = clipEdge(ring, lon => lon >= lonMin);
  if (r.length < 3) return [];
  r = clipEdge(r, lon => lon <= lonMax);
  return r.length >= 3 ? r : [];
}

// For polygons too wide for one gnomonic chart: clip into longitude bands,
// triangulate each band's piece on its own chart, and merge the results.
function bandedSphericalGeometry(outerLL, holesLL) {
  let lonMin = Infinity, lonMax = -Infinity;
  for (const p of outerLL) { if (p[0] < lonMin) lonMin = p[0]; if (p[0] > lonMax) lonMax = p[0]; }
  const BAND = 40; // degrees
  const merged = [];
  for (let lo = lonMin; lo < lonMax; lo += BAND) {
    const hi = Math.min(lo + BAND, lonMax);
    const piece = clipRingToLonBand(outerLL, lo, hi);
    if (piece.length < 3) continue;
    // holes clipped to the same band
    const pieceHoles = holesLL.map(h => clipRingToLonBand(h, lo, hi)).filter(h => h.length >= 3);
    const geo = sphericalPolygonGeometry(piece, pieceHoles, true);
    if (geo) {
      const pos = geo.getAttribute('position');
      for (let i = 0; i < pos.count; i++) merged.push(pos.getX(i), pos.getY(i), pos.getZ(i));
    }
  }
  if (!merged.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(merged, 3));
  g.computeVertexNormals();
  return g;
}

// signed area of a 2D ring (positive = CCW)
function ringArea2D(pts) {
  let a = 0;
  for (let i = 0, n = pts.length, j = n - 1; i < n; j = i++) {
    a += (pts[j].x * pts[i].y) - (pts[i].x * pts[j].y);
  }
  return a / 2;
}

// Triangulate a spherical polygon by projecting it gnomonically onto the
// tangent plane at the polygon's centroid, ear-clipping there, then mapping
// vertices back to the sphere. In a gnomonic projection every great circle is
// a straight line, so triangle edges become geodesics that hug the surface —
// this removes the pole distortion and antimeridian spanning that a flat
// lon/lat triangulation produces. Each polygon uses its OWN center, so there
// is no global seam.
function sphericalPolygonGeometry(outer, holes, noBand) {
  const clean = (ring) => {
    const pts = ring.slice();
    if (pts.length > 1) {
      const a = pts[0], b = pts[pts.length - 1];
      if (a[0] === b[0] && a[1] === b[1]) pts.pop();
    }
    // drop near-duplicate consecutive vertices — ear-clipping turns these into
    // zero-area slivers that read as overlapping triangles
    const out = [];
    const EPS = 1e-7;
    for (let i = 0; i < pts.length; i++) {
      const cur = pts[i], prev = pts[(i + pts.length - 1) % pts.length];
      if (Math.abs(cur[0] - prev[0]) > EPS || Math.abs(cur[1] - prev[1]) > EPS) out.push(cur);
    }
    return out;
  };

  const outerLL = clean(outer);
  if (outerLL.length < 3) return null;
  const holesLL = (holes || []).map(clean).filter(h => h.length >= 3);

  // 3D unit vectors for every vertex
  const toVec = (p) => llToVec(p[1], p[0], 1).normalize();
  const outerV = outerLL.map(toVec);
  const holesV = holesLL.map(h => h.map(toVec));

  // projection center = normalized average of the outer ring's 3D points
  const center = new THREE.Vector3();
  for (const v of outerV) center.add(v);
  if (center.lengthSq() < 1e-9) return null; // ring wraps a full great circle; skip
  center.normalize();

  // build a tangent basis (east, north) at the center
  const up = new THREE.Vector3(0, 1, 0);
  let east = new THREE.Vector3().crossVectors(up, center);
  if (east.lengthSq() < 1e-9) east = new THREE.Vector3(1, 0, 0); // center at a pole
  east.normalize();
  const north = new THREE.Vector3().crossVectors(center, east).normalize();

  // gnomonic projection: project v onto the plane tangent at center.
  // valid only for the hemisphere facing center (v·center > 0).
  const project = (v) => {
    const d = v.dot(center);
    if (d <= 1e-4) return null; // point on far side / at 90°+, can't project
    const s = 1 / d;
    return new THREE.Vector2(v.clone().multiplyScalar(s).dot(east),
                             v.clone().multiplyScalar(s).dot(north));
  };

  const projectRing = (ring) => {
    const out = [];
    for (const v of ring) {
      const p = project(v);
      if (!p) return null; // any unprojectable point => polygon too large for one gnomonic chart
      out.push(p);
    }
    return out;
  };

  const contour = projectRing(outerV);
  if (!contour || contour.length < 3) {
    // Polygon too large for a single gnomonic chart (e.g. Russia, Antarctica).
    // Fall back to clipping it into ~40°-wide longitude bands and triangulating
    // each band on its own chart, so the whole country still renders. The
    // noBand guard stops a degenerate band from recursing forever.
    if (noBand) return null;
    return bandedSphericalGeometry(outerLL, holesLL);
  }
  const holeContours = [];
  for (const hv of holesV) {
    const hc = projectRing(hv);
    if (hc && hc.length >= 3) holeContours.push(hc);
  }

  // winding: contour CCW, holes CW (what triangulateShape expects)
  const forceWinding = (pts, wantCCW) =>
    (ringArea2D(pts) > 0) === wantCCW ? pts : pts.slice().reverse();
  const c2 = forceWinding(contour, true);
  const h2 = holeContours.map(h => forceWinding(h, false));

  let faces;
  try { faces = THREE.ShapeUtils.triangulateShape(c2, h2); }
  catch (e) { return null; }
  if (!faces || !faces.length) return null;

  // map each 2D projected point back to a 3D sphere point:
  // unproject p -> direction (center + p.x*east + p.y*north), normalize, *R
  const flat2D = c2.slice();
  for (const h of h2) for (const v of h) flat2D.push(v);
  const flat3D = flat2D.map(p => {
    const dir = center.clone()
      .add(east.clone().multiplyScalar(p.x))
      .add(north.clone().multiplyScalar(p.y));
    return dir.normalize().multiplyScalar(R);
  });

  const positions = [];
  for (const tri of faces) {
    for (const idx of tri) {
      const s = flat3D[idx];
      positions.push(s.x, s.y, s.z);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.computeVertexNormals();
  return g;
}

// Convert device orientation (alpha/beta/gamma) into a look quaternion,
// accounting for the -90° tilt (phone held upright vs flat) and current screen
// rotation. Used by lookDirection() when sensors are active.
function deviceQuaternion() {
  const q = new THREE.Quaternion();
  const e = new THREE.Euler(oBeta, oAlpha, -oGamma, 'YXZ');
  q.setFromEuler(e);
  q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2));
  if (screenAngle) q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), -screenAngle));
  return q;
}

// Touch/mouse fallback when motion sensors are unavailable (desktop, or sensor
// permission blocked). Drag updates dragYaw/dragPitch, consumed by lookDirection().
function enableDragFallback() {
  if (dragMode) return;
  dragMode = true;
  let px, py, down = false;
  const c = $('scene');
  c.addEventListener('pointerdown', e => { down = true; px = e.clientX; py = e.clientY; });
  c.addEventListener('pointermove', e => {
    if (!down) return;
    dragYaw   -= (e.clientX - px) * 0.005;
    dragPitch -= (e.clientY - py) * 0.005;
    dragPitch = Math.max(-1.55, Math.min(1.55, dragPitch));
    px = e.clientX; py = e.clientY;
  });
  c.addEventListener('pointerup', () => down = false);
  c.addEventListener('pointercancel', () => down = false);
}

// Current gaze as a unit vector: from device sensors if available, otherwise
// from the drag fallback's yaw/pitch.
function lookDirection() {
  if (dragMode) {
    return new THREE.Vector3(
      Math.cos(dragPitch) * Math.sin(dragYaw),
      Math.sin(dragPitch),
      Math.cos(dragPitch) * Math.cos(dragYaw)
    );
  }
  return new THREE.Vector3(0, 0, -1).applyQuaternion(deviceQuaternion());
}

// Per-frame: rotate the globe so the user's lat/lon sits under the camera,
// update the live sun direction, aim the camera by gaze, refresh the HUD
// readouts (depth, heading/pitch, antipode target), raycast the reticle to
// label the country under the crosshair, and render.
function loop() {
  requestAnimationFrame(loop);

  const up = llToVec(userLat, userLon, R).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(up, new THREE.Vector3(0, 1, 0));
  globe.quaternion.copy(q);

  // Sun direction in geometry (pre-rotation) space, then rotated by the same
  // globe quaternion so it lands in the world space the fill shader compares
  // against (the shader's worldDir is post-modelMatrix). Recomputed live so the
  // day/night terminator tracks the real clock.
  const sp = subsolarPoint(new Date());
  const sunLocal = llToVec(sp.lat, sp.lon, 1).normalize();
  sunUniforms.uSunDir.value.copy(sunLocal.applyQuaternion(q));

  // Current gaze direction (from device sensors or drag fallback)
  const dir = lookDirection().normalize();

  // Eye sits at exactly 1x Earth radius — on the surface. Do not offset this;
  // the horizon ring (also at y=R) is defined to pass through this exact height,
  // so any change here must be mirrored there or the horizon will float.
  const eye = new THREE.Vector3(0, R, 0);
  camera.position.copy(eye);
  camera.lookAt(eye.clone().add(dir));

  // Place the sky bodies along their world-space directions, out at SKY_DIST.
  // The Sun reuses the direction we just put in the lighting uniform; the Moon
  // is computed the same way (sub-lunar point -> direction -> globe rotation),
  // so its phase, set by the shared uSunDir, comes out correct automatically.
  if (sunMesh) {
    const worldSun = sunUniforms.uSunDir.value;
    sunMesh.position.copy(eye).addScaledVector(worldSun, SKY_DIST);
    sunGlow.position.copy(sunMesh.position);
    sunLabel.position.copy(sunMesh.position);

    const mp = moonPosition(new Date());
    const worldMoon = llToVec(mp.lat, mp.lon, 1).applyQuaternion(q);
    moonMesh.position.copy(eye).addScaledVector(worldMoon, SKY_DIST);
    moonLabel.position.copy(moonMesh.position);
    // moon radius / distance -> live angular radius; Moon radius = 0.2725 R⊕
    const moonAngR = Math.atan(0.2725 / mp.dist);
    moonMesh.scale.setScalar(SKY_DIST * Math.tan(moonAngR));
  }

  const downAmount = -dir.y;
  $('depth').textContent =
    downAmount > 0.85 ? 'core / antipode' :
    downAmount > 0.4  ? 'deep mantle' :
    downAmount > 0.05 ? 'crust' : 'sky';

  const heading = ((Math.atan2(dir.x, dir.z) * R2D) + 360) % 360;
  const pitch = Math.asin(Math.max(-1, Math.min(1, dir.y))) * R2D;
  $('orient').textContent =
    heading.toFixed(0) + '\u00b0 \u00b7 ' + pitch.toFixed(0) + '\u00b0' +
    (dragMode ? ' (drag)' : '');

  // "Looking at": the exact coordinates of the point under the reticle. The eye
  // sits ON the globe (radius R), so the gaze ray meets the sphere once more at
  // t = -2R*dir.y — ahead of us only when we're aimed below the horizon
  // (dir.y<0). Undo the globe's spin to read that world point back as lat/lon.
  if (dir.y < -1e-3) {
    const t = -2 * R * dir.y;
    const hitPt = eye.clone().addScaledVector(dir, t);
    const local = hitPt.applyQuaternion(q.clone().conjugate()); // world -> geometry
    const ll = vecToLL(local);
    $('target').textContent = fmt(ll.lat, ll.lon);
  } else {
    $('target').textContent = '— (aim down)';
  }

  // Label whatever filled country sits under the center reticle. The reticle is
  // screen-center, so we cast from NDC (0,0) along the camera. We may hit the
  // near side first and the far side second; take the farthest hit when we're
  // looking down through the planet so the label matches the "through" view.
  if (raycaster && fills && fills.children.length) {
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    const hits = raycaster.intersectObjects(fills.children, false);
    if (hits.length) {
      const pick = downAmount > 0.3 ? hits[hits.length - 1] : hits[0];
      hoverName = pick.object.userData.name || '';
    } else {
      hoverName = '';
    }
    $('reticleLabel').textContent = hoverName;
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
